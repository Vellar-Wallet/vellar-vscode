name: CI

# Runs the acceptance/regression scripts a human runs by hand today (see
# README's "Acceptance test" section), so a future change can't silently break
# one of them without anyone noticing.
#
# Three groups, all still no @vscode/test-electron and no real extension host:
#  - The original five exercise src/detectors, src/injector, and
#    src/generators directly — genuinely vscode-free, no fake module needed
#    at all.
#  - Three (the sidebar's postMessage-leak audit, the settlements pagination
#    check, and the test-payment assertion check) exercise code that DOES
#    import "vscode" throughout (dataProvider.ts, webviewProvider.ts,
#    runTestPayment.ts) — those run against scripts/vscode-test-stub.js, a
#    small fake of the surface those modules actually call, substituted at
#    bundle time via esbuild.
#  - One (the Horizon timeout regression check) exercises usdc.ts, which has
#    NO vscode import at all — no stub needed there either, just a plain
#    esbuild bundle with vscode marked external (a no-op, since it's never
#    actually imported).
# No live network call anywhere in any of the newer checks (see their own
# file-header comments for the fixture/fake modules that make that true).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Root node_modules is deliberately NOT cached here: `npm ci` (below)
      # unconditionally deletes an existing node_modules before it installs
      # ("removed before npm ci begins its install" — npm's own docs), so
      # caching that path would be restored, immediately wiped, and rebuilt
      # from the network every run regardless of hit or miss. Caching it was
      # tried and confirmed useless before this comment was written, not
      # assumed.
      #
      # Fixture node_modules are the part that actually benefits: they're
      # gitignored (fixtures/**/node_modules/), so they don't arrive with
      # checkout, and each script's own `npm install` inside its fixture dir
      # (not `ci`, so it reconciles rather than wipes) turns into a fast
      # no-op on a cache hit instead of a real network install. Keyed on
      # every fixture lockfile so a change to any one correctly busts it.
      - name: Cache fixture node_modules
        uses: actions/cache@v4
        with:
          path: |
            fixtures/express-fresh/node_modules
            fixtures/fastify-fresh/node_modules
            fixtures/fastify-multiline-import/node_modules
            fixtures/next-app-router-fresh/node_modules
          key: ${{ runner.os }}-fixtures-${{ hashFiles('fixtures/*/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fixtures-

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # Fast (<1s), no fixtures needed — runs first so a Horizon-hang
      # regression (see scripts/run-horizon-timeout-check.js's own header
      # comment for the real production bug this guards against) fails
      # quickly rather than after the slower fixture-based checks below.
      - name: Run Horizon timeout regression check
        run: node scripts/run-horizon-timeout-check.js

      - name: Run acceptance test (Express)
        run: node scripts/run-acceptance-test.js

      - name: Run Fastify check
        run: node scripts/run-fastify-check.js

      - name: Run Next.js App Router check
        run: node scripts/run-next-app-router-check.js

      - name: Run package manager detection checks
        run: node scripts/run-package-manager-check.js

      # Named run-fastify-multiline-import-check.js in this repo — the task
      # named this script run-import-block-regression.js, which doesn't exist;
      # using the real file rather than a path that would fail on first push.
      - name: Run multi-line import regression check
        run: node scripts/run-fastify-multiline-import-check.js

      - name: Typecheck (main + scripts)
        run: npm run typecheck

      - name: Run sidebar postMessage leak check
        run: node scripts/run-postmessage-leak-check.js

      - name: Run settlements pagination check
        run: node scripts/run-settlements-pagination-check.js

      - name: Run test-payment assertion check
        run: node scripts/run-testpayment-assertion-check.js
